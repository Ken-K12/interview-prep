[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name              tail
    Path              /var/log/lab/app.log
    Tag               app
    Read_from_Head    On
    Refresh_Interval  2

[OUTPUT]
    Name               cloudwatch_logs
    Match              *
    region             ap-northeast-1
    log_group_name     /lab/missing-logs
    log_stream_name    app-1
    auto_create_group  Off
