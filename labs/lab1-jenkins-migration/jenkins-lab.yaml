AWSTemplateFormatVersion: '2010-09-09'
Description: Jenkins migration lab

Parameters:
  LabName:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9-]{1,32}$'
  MyIp:
    Type: String
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
  VpcId:
    Type: AWS::EC2::VPC::Id                              # 存在しないVPCはデプロイ前にエラー
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Ref LabName
      KeyType: ed25519

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Ref LabName
      GroupDescription: Jenkins migration lab
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Sub '${MyIp}/32', Description: 'lab:codespace' }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Sub '${MyIp}/32', Description: 'lab:codespace' }

  # 自分自身のSGを参照するルールは、循環参照を避けるため別リソースにする
  IngressJenkinsInternal:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt SecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !GetAtt SecurityGroup.GroupId

  WaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        KeyName: !Ref KeyPair
        SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
        CreditSpecification: { CpuCredits: standard }   # KodeKloud: t3 は standard 必須
        MetadataOptions:
          HttpTokens: required          # IMDSv2を強制
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { Encrypted: true, VolumeType: gp3, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: volume
            Tags: [{ Key: Lab, Value: !Ref LabName }]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            exec > /var/log/userdata.log 2>&1
            signal() {   # WaitCondition に成功/失敗を通知する
              curl -fsS -X PUT -H 'Content-Type:' \
                --data-binary "{\"Status\":\"$1\",\"Reason\":\"$1\",\"UniqueId\":\"$(hostname)\",\"Data\":\"$1\"}" \
                '${WaitHandle}'
            }
            trap 'signal FAILURE' ERR
            dnf install -y docker jq
            systemctl enable --now docker
            mkdir -p /srv/jenkins_home && chown 1000:1000 /srv/jenkins_home
            signal SUCCESS

  OldInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.medium
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags: [{ Key: Name, Value: !Sub '${LabName}-old' }]

  NewInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.medium
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags: [{ Key: Name, Value: !Sub '${LabName}-new' }]

  FrontInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags: [{ Key: Name, Value: !Sub '${LabName}-front' }]

  # 3台すべてから SUCCESS が届くまで待つ（15分でタイムアウト → ロールバック）
  UserDataDone:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: [OldInstance, NewInstance, FrontInstance]
    Properties:
      Handle: !Ref WaitHandle
      Count: 3
      Timeout: '900'

Outputs:
  Sg:        { Value: !GetAtt SecurityGroup.GroupId }
  KeyPairId: { Value: !GetAtt KeyPair.KeyPairId }
  OldId:     { Value: !Ref OldInstance }
  NewId:     { Value: !Ref NewInstance }
  FrontId:   { Value: !Ref FrontInstance }
  OldPub:    { Value: !GetAtt OldInstance.PublicIp }
  OldPriv:   { Value: !GetAtt OldInstance.PrivateIp }
  NewPub:    { Value: !GetAtt NewInstance.PublicIp }
  NewPriv:   { Value: !GetAtt NewInstance.PrivateIp }
  FrontPub:  { Value: !GetAtt FrontInstance.PublicIp }